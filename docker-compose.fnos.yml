services:
  litepan:
    build: .
    container_name: litepan
    environment:
      - TZ=Asia/Shanghai
      - LITEPAN_DISABLE_CSRF_CHECK=true
    volumes:
      - /vol1/1000/docker/litepango/data:/app/data
      - /vol1/1000/docker/litepango/strm:/app/strm
      - /vol1/1000/docker/litepango/mounts:/app/mounts:shared
    devices:
      - /dev/fuse:/dev/fuse
    privileged: true
    pid: "host"
    network_mode: "host"
    restart: always
