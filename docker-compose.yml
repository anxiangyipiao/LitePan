version: "2.1"

services:
  litepan:
    build: .
    container_name: litepan
    restart: unless-stopped
    ports:
      - "5211:5211"
    environment:
      - TZ=Asia/Shanghai
      # 可选：关闭 Origin 来源校验（解决反代/内网访问报"请求来源不受信任"）
      # - LITEPAN_DISABLE_CSRF_CHECK=true
    volumes:
      - ./data:/app/data
      - ./strm:/app/strm
      - ./mounts:/app/mounts:shared

      # 可选：将 FUSE 读缓存单独映射，建议放到更快的磁盘
      # - ./fuse_read_cache:/app/data/fuse_read_cache
    devices:
      - /dev/fuse:/dev/fuse
    pid: "host"
    privileged: true
